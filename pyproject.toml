[project]
name = "contextbridge"
version = "0.1.0"
description = "Local-first, agent-independent developer and project memory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
contextbridge = "contextbridge.product.cli:main"
contextbridge-mcp = "contextbridge.mcp_adapter.cli:main"
contextbridge-expire-capture = "contextbridge.engine.maintenance:main"
contextbridge-import = "contextbridge.capture_adapters.cli:main"

[project.optional-dependencies]
product = ["keyring>=25.6,<26"]
workers = [
    "celery[redis]>=5.6.3,<5.7",
]
viewer = [
    "streamlit>=1.65,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a migrated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The release pipeline builds these assets first. Source users run frontend/npm build.
[tool.hatch.build.targets.wheel]
packages = ["src/contextbridge"]
exclude = ["src/contextbridge/product/web"]

[tool.hatch.build.targets.wheel.force-include]
"src/contextbridge/product/web" = "contextbridge/product/web"
