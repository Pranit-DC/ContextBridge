services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: contextbridge
      POSTGRES_USER: contextbridge
      POSTGRES_PASSWORD: ${CONTEXTBRIDGE_DB_PASSWORD:?Set database password in .env}
    ports:
      - "127.0.0.1:${CONTEXTBRIDGE_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U contextbridge -d contextbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:${CONTEXTBRIDGE_DB_PASSWORD}@db:5432/contextbridge
      CONTEXTBRIDGE_API_TOKEN: ${CONTEXTBRIDGE_API_TOKEN:?Set API token in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:${CONTEXTBRIDGE_DB_PASSWORD}@db:5432/contextbridge
      CONTEXTBRIDGE_API_TOKEN: ${CONTEXTBRIDGE_API_TOKEN:?Set API token in .env}
      CONTEXTBRIDGE_DEVELOPER_ID: ${CONTEXTBRIDGE_DEVELOPER_ID:-local-developer}
      CONTEXTBRIDGE_CAPTURE_PROJECT_ID: ${CONTEXTBRIDGE_CAPTURE_PROJECT_ID:-}
      CONTEXTBRIDGE_CAPTURE_ALLOW_DEVELOPER: ${CONTEXTBRIDGE_CAPTURE_ALLOW_DEVELOPER:-false}
      CONTEXTBRIDGE_CAPTURE_RETENTION_SECONDS: ${CONTEXTBRIDGE_CAPTURE_RETENTION_SECONDS:-86400}
      CONTEXTBRIDGE_CAPTURE_MAX_BUFFERED_EVENTS: ${CONTEXTBRIDGE_CAPTURE_MAX_BUFFERED_EVENTS:-1000}
      CONTEXTBRIDGE_CANDIDATE_RETENTION_SECONDS: ${CONTEXTBRIDGE_CANDIDATE_RETENTION_SECONDS:-3600}
      CONTEXTBRIDGE_INTEGRATION_FACTORY: ${CONTEXTBRIDGE_INTEGRATION_FACTORY:-}
      CONTEXTBRIDGE_FORMATION_ENABLED: ${CONTEXTBRIDGE_FORMATION_ENABLED:-false}
      CONTEXTBRIDGE_CONSOLIDATION_ENABLED: ${CONTEXTBRIDGE_CONSOLIDATION_ENABLED:-false}
      CONTEXTBRIDGE_FORMATION_PROVIDER: ${CONTEXTBRIDGE_FORMATION_PROVIDER:-}
      CONTEXTBRIDGE_FORMATION_MODEL: ${CONTEXTBRIDGE_FORMATION_MODEL:-}
      CONTEXTBRIDGE_FORMATION_API_KEY: ${CONTEXTBRIDGE_FORMATION_API_KEY:-}
      CONTEXTBRIDGE_FORMATION_BASE_URL: ${CONTEXTBRIDGE_FORMATION_BASE_URL:-}
      CONTEXTBRIDGE_FORMATION_ALLOW_HOSTED: ${CONTEXTBRIDGE_FORMATION_ALLOW_HOSTED:-false}
      CONTEXTBRIDGE_FORMATION_ALLOW_PAID: ${CONTEXTBRIDGE_FORMATION_ALLOW_PAID:-false}
      CONTEXTBRIDGE_FORMATION_GROQ_FREE_PLAN_CONFIRMED: ${CONTEXTBRIDGE_FORMATION_GROQ_FREE_PLAN_CONFIRMED:-false}
      CONTEXTBRIDGE_FORMATION_GROQ_REASONING_EFFORT: ${CONTEXTBRIDGE_FORMATION_GROQ_REASONING_EFFORT:-low}
      CONTEXTBRIDGE_FORMATION_TIMEOUT_SECONDS: ${CONTEXTBRIDGE_FORMATION_TIMEOUT_SECONDS:-10}
      CONTEXTBRIDGE_FORMATION_MAX_OUTPUT_TOKENS: ${CONTEXTBRIDGE_FORMATION_MAX_OUTPUT_TOKENS:-1024}
      CONTEXTBRIDGE_FORMATION_RESPONSE_FORMAT: ${CONTEXTBRIDGE_FORMATION_RESPONSE_FORMAT:-json_schema}
      CONTEXTBRIDGE_FORMATION_TOKENS_PER_MINUTE: ${CONTEXTBRIDGE_FORMATION_TOKENS_PER_MINUTE:-8000}
      CONTEXTBRIDGE_FORMATION_TOKENS_PER_DAY: ${CONTEXTBRIDGE_FORMATION_TOKENS_PER_DAY:-50000}
      CONTEXTBRIDGE_EMBEDDING_PROVIDER: ${CONTEXTBRIDGE_EMBEDDING_PROVIDER:-}
      CONTEXTBRIDGE_EMBEDDING_API_KEY: ${CONTEXTBRIDGE_EMBEDDING_API_KEY:-}
      CONTEXTBRIDGE_EMBEDDING_BASE_URL: ${CONTEXTBRIDGE_EMBEDDING_BASE_URL:-}
      CONTEXTBRIDGE_EMBEDDING_MODEL_ID: ${CONTEXTBRIDGE_EMBEDDING_MODEL_ID:-}
      CONTEXTBRIDGE_EMBEDDING_DIMENSIONS: ${CONTEXTBRIDGE_EMBEDDING_DIMENSIONS:-}
      CONTEXTBRIDGE_PROVIDER_TIMEOUT_SECONDS: ${CONTEXTBRIDGE_PROVIDER_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    profiles: [workers]
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: [workers]
    build:
      context: .
      args:
        CONTEXTBRIDGE_WORKERS: "true"
    environment: &worker_environment
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:${CONTEXTBRIDGE_DB_PASSWORD}@db:5432/contextbridge
      CONTEXTBRIDGE_API_TOKEN: ${CONTEXTBRIDGE_API_TOKEN:?Set API token in .env}
      CONTEXTBRIDGE_DEVELOPER_ID: ${CONTEXTBRIDGE_DEVELOPER_ID:-local-developer}
      CONTEXTBRIDGE_CAPTURE_PROJECT_ID: ${CONTEXTBRIDGE_CAPTURE_PROJECT_ID:-}
      CONTEXTBRIDGE_CAPTURE_ALLOW_DEVELOPER: ${CONTEXTBRIDGE_CAPTURE_ALLOW_DEVELOPER:-false}
      CONTEXTBRIDGE_CAPTURE_RETENTION_SECONDS: ${CONTEXTBRIDGE_CAPTURE_RETENTION_SECONDS:-86400}
      CONTEXTBRIDGE_CANDIDATE_RETENTION_SECONDS: ${CONTEXTBRIDGE_CANDIDATE_RETENTION_SECONDS:-3600}
      CONTEXTBRIDGE_WORKER_FACTORY: ${CONTEXTBRIDGE_WORKER_FACTORY:-}
      CONTEXTBRIDGE_INTEGRATION_FACTORY: ${CONTEXTBRIDGE_INTEGRATION_FACTORY:-}
      CONTEXTBRIDGE_FORMATION_ENABLED: ${CONTEXTBRIDGE_FORMATION_ENABLED:-false}
      CONTEXTBRIDGE_CONSOLIDATION_ENABLED: ${CONTEXTBRIDGE_CONSOLIDATION_ENABLED:-false}
      CONTEXTBRIDGE_FORMATION_PROVIDER: ${CONTEXTBRIDGE_FORMATION_PROVIDER:-}
      CONTEXTBRIDGE_FORMATION_MODEL: ${CONTEXTBRIDGE_FORMATION_MODEL:-}
      CONTEXTBRIDGE_FORMATION_API_KEY: ${CONTEXTBRIDGE_FORMATION_API_KEY:-}
      CONTEXTBRIDGE_FORMATION_BASE_URL: ${CONTEXTBRIDGE_FORMATION_BASE_URL:-}
      CONTEXTBRIDGE_FORMATION_ALLOW_HOSTED: ${CONTEXTBRIDGE_FORMATION_ALLOW_HOSTED:-false}
      CONTEXTBRIDGE_FORMATION_ALLOW_PAID: ${CONTEXTBRIDGE_FORMATION_ALLOW_PAID:-false}
      CONTEXTBRIDGE_FORMATION_GROQ_FREE_PLAN_CONFIRMED: ${CONTEXTBRIDGE_FORMATION_GROQ_FREE_PLAN_CONFIRMED:-false}
      CONTEXTBRIDGE_FORMATION_GROQ_REASONING_EFFORT: ${CONTEXTBRIDGE_FORMATION_GROQ_REASONING_EFFORT:-low}
      CONTEXTBRIDGE_FORMATION_TIMEOUT_SECONDS: ${CONTEXTBRIDGE_FORMATION_TIMEOUT_SECONDS:-10}
      CONTEXTBRIDGE_FORMATION_MAX_OUTPUT_TOKENS: ${CONTEXTBRIDGE_FORMATION_MAX_OUTPUT_TOKENS:-1024}
      CONTEXTBRIDGE_FORMATION_RESPONSE_FORMAT: ${CONTEXTBRIDGE_FORMATION_RESPONSE_FORMAT:-json_schema}
      CONTEXTBRIDGE_FORMATION_TOKENS_PER_MINUTE: ${CONTEXTBRIDGE_FORMATION_TOKENS_PER_MINUTE:-8000}
      CONTEXTBRIDGE_FORMATION_TOKENS_PER_DAY: ${CONTEXTBRIDGE_FORMATION_TOKENS_PER_DAY:-50000}
      CONTEXTBRIDGE_EMBEDDING_PROVIDER: ${CONTEXTBRIDGE_EMBEDDING_PROVIDER:-}
      CONTEXTBRIDGE_EMBEDDING_API_KEY: ${CONTEXTBRIDGE_EMBEDDING_API_KEY:-}
      CONTEXTBRIDGE_EMBEDDING_BASE_URL: ${CONTEXTBRIDGE_EMBEDDING_BASE_URL:-}
      CONTEXTBRIDGE_EMBEDDING_MODEL_ID: ${CONTEXTBRIDGE_EMBEDDING_MODEL_ID:-}
      CONTEXTBRIDGE_EMBEDDING_DIMENSIONS: ${CONTEXTBRIDGE_EMBEDDING_DIMENSIONS:-}
      CONTEXTBRIDGE_PROVIDER_TIMEOUT_SECONDS: ${CONTEXTBRIDGE_PROVIDER_TIMEOUT_SECONDS:-10}
      CONTEXTBRIDGE_BROKER_URL: redis://redis:6379/0
      CONTEXTBRIDGE_WORKER_MAX_ATTEMPTS: ${CONTEXTBRIDGE_WORKER_MAX_ATTEMPTS:-3}
      CONTEXTBRIDGE_WORKER_TIMEOUT_SECONDS: ${CONTEXTBRIDGE_WORKER_TIMEOUT_SECONDS:-120}
      CONTEXTBRIDGE_WORKER_RETRY_SECONDS: ${CONTEXTBRIDGE_WORKER_RETRY_SECONDS:-10}
      CONTEXTBRIDGE_WORKER_DIAGNOSTIC_RETENTION_SECONDS: ${CONTEXTBRIDGE_WORKER_DIAGNOSTIC_RETENTION_SECONDS:-604800}
    command: ["celery", "-A", "contextbridge.background.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    profiles: [workers]
    build:
      context: .
      args:
        CONTEXTBRIDGE_WORKERS: "true"
    environment: *worker_environment
    command: ["python", "-m", "contextbridge.background.celery_app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
