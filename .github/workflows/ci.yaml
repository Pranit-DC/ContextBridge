name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: contextbridge_test
          POSTGRES_USER: contextbridge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contextbridge -d contextbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@localhost:5432/contextbridge_test
      CONTEXTBRIDGE_TEST_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@localhost:5432/contextbridge_test
      CONTEXTBRIDGE_API_TOKEN: ci-only-api-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest --cov=contextbridge --cov-report=term-missing
      - name: Verify migration round trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
