name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: contextbridge_test
          POSTGRES_USER: contextbridge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U contextbridge -d contextbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_TEST_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_API_TOKEN: ci-only-api-token-at-least-32-characters
      CONTEXTBRIDGE_REQUIRE_VECTOR: "1"
      CONTEXTBRIDGE_TEST_BROKER_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras ruff format --check .
      - run: uv run --all-extras alembic upgrade head
      - run: uv run --all-extras alembic check
      - run: uv run --all-extras pytest --cov=contextbridge --cov-report=term-missing
      - name: Verify migration round trip
        run: |
          uv run --all-extras alembic downgrade base
          uv run --all-extras alembic upgrade head

  vector_compat:
    # Real pgvector checks on PostgreSQL 17 complement the native Windows core job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: contextbridge_test
          POSTGRES_USER: contextbridge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U contextbridge -d contextbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_TEST_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_API_TOKEN: ci-only-api-token-at-least-32-characters
      CONTEXTBRIDGE_REQUIRE_VECTOR: "1"
      CONTEXTBRIDGE_TEST_BROKER_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --all-extras alembic upgrade head
      - run: uv run --all-extras alembic check
      - run: uv run --all-extras pytest --cov=contextbridge --cov-report=term-missing
      - name: Verify migration round trip
        run: |
          uv run --all-extras alembic downgrade base
          uv run --all-extras alembic upgrade head

  windows:
    # The hosted image includes PostgreSQL 17. Linux/Compose continue to use PostgreSQL 18.
    # Native Windows covers core behavior. Vector numerical tests explicitly skip here;
    # vector_compat/test run them on real pgvector. Windows Docker host checks remain pending.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CONTEXTBRIDGE_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_TEST_DATABASE_URL: postgresql+psycopg://contextbridge:ci-only-password@127.0.0.1:5432/contextbridge_test
      CONTEXTBRIDGE_API_TOKEN: ci-only-api-token-at-least-32-characters
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Start native PostgreSQL and create disposable test database
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql-x64-17
          $service | Set-Service -StartupType Manual
          $service | Start-Service
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN/psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE contextbridge LOGIN PASSWORD 'ci-only-password';"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PGBIN/createdb.exe" -h localhost -U postgres -O contextbridge contextbridge_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras ruff format --check .
      - run: uv run --all-extras alembic upgrade head
      - run: uv run --all-extras alembic check
      - name: Run Windows tests with hang diagnostics
        shell: pwsh
        run: |
          uv run --all-extras pytest -vv --durations=20 -o faulthandler_timeout=90 -o faulthandler_exit_on_timeout=true --cov=contextbridge --cov-report=term-missing 2>&1 | Tee-Object -FilePath windows-pytest.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $lastTest = Get-Content windows-pytest.log | Select-String '^tests[\\/].*::' | Select-Object -Last 1
            if ($lastTest) {
              $testName = ($lastTest.Line -split '\s+')[0]
              $testName = $testName.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows pytest stopped::$testName"
            }
          }
          exit $testExit
      - name: Verify migration downgrade
        run: uv run alembic downgrade base
      - name: Verify migration upgrade after downgrade
        run: uv run alembic upgrade head

  worker_stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Verify disposable Compose restart and forgetting
        run: uv run --all-extras python scripts/worker_stack_probe.py
